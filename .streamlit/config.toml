[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111C2E"
codeBackgroundColor = "#0F1A2B"
textColor = "#E7EEF8"
linkColor = "#7DD3FC"
borderColor = "#25344A"
codeTextColor = "#CBD5E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "23px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 650, 600, 600, 500, 500]
linkUnderline = false

greenColor = "#34D399"
redColor = "#FB7185"
yellowColor = "#FACC15"
orangeColor = "#FB923C"
blueColor = "#38BDF8"
violetColor = "#A78BFA"
grayColor = "#94A3B8"

chartCategoricalColors = [
    "#38BDF8",
    "#34D399",
    "#A78BFA",
    "#FB7185",
    "#FACC15",
    "#22D3EE",
    "#94A3B8",
    "#FB923C",
]
chartSequentialColors = [
    "#082F49",
    "#0C4A6E",
    "#075985",
    "#0369A1",
    "#0284C7",
    "#0EA5E9",
    "#38BDF8",
    "#7DD3FC",
    "#BAE6FD",
    "#E0F2FE",
]
dataframeBorderColor = "#25344A"
dataframeHeaderBackgroundColor = "#111C2E"

[theme.sidebar]
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111C2E"
