version: 2
risks:
  - id: cash_burn
    name: 现金消耗与融资依赖
    owner: finance
    severity: high
    evidence_fields: [cash_balance, operating_cash_flow, reporting_period]
    query: 经营活动所用现金净额 负现金流量 研发活动 现金流出
    required_keywords: ["負現金流量", "研發活動"]
    claim: 公司在业绩记录期持续产生经营现金净流出，且现金流出主要来自研发活动，资金消耗及后续融资需求值得关注。

  - id: persistent_loss
    name: 持续亏损与盈利不确定性
    owner: finance
    severity: high
    evidence_fields: [net_profit, reporting_period]
    query: 历史亏损 重大研发投资 授权收入 盈利能力
    required_keywords: ["歷史虧損", "重大研發投資"]
    claim: 公司在业绩记录期录得历史亏损，盈利能力受到重大研发投入、授权交易收入确认节奏等因素影响。

  - id: customer_concentration
    name: 客户集中度较高
    owner: finance
    severity: high
    evidence_fields: [top_customer_ratio, reporting_period]
    query: 五大客户 最大客户 总收入 客户集中 重大不利影响
    required_keywords: ["五大客戶", "最大客戶"]
    claim: 公司来自前五大客户及最大客户的收入占比较高，主要客户流失或付款、续约变化可能显著影响经营表现。

  - id: supplier_concentration
    name: 供应商集中度
    owner: finance
    severity: medium
    evidence_fields: [top_supplier_ratio, reporting_period]
    query: 五大供应商 最大供应商 采购总额 临床试验 第三方服务
    required_keywords: ["五大供應商", "最大供應商"]
    claim: 公司部分临床前评估及临床试验活动依赖外部供应商，前五大供应商占采购总额比例值得持续监测。

  - id: license_dependency
    name: 牌照与监管批准依赖
    owner: legal
    severity: high
    evidence_fields: [license, jurisdiction, status]
    query: 监管机构 许可 牌照 批准 未能遵守 业务经营受限
    required_keywords: ["監管機構", "許可證", "未能遵守"]
    claim: 公司在多个司法辖区开展生物医药研发，需要持续满足牌照、许可及监管要求，未能遵守可能导致业务受限或执法措施。

  - id: pipeline_uncertainty
    name: 核心管线与临床开发不确定性
    owner: business
    severity: high
    evidence_fields: [product, stage, milestone]
    query: 候选药物 临床试验 安全性 疗效 未成功 商业化
    required_keywords: ["候選藥物", "臨床試驗", "未成功"]
    claim: 多数由公司AI平台开发的分子尚未成功通过临床试验，候选药物的安全性、疗效和商业化仍存在较高不确定性。

  - id: issuance_structure
    name: 基石配售占比较高
    owner: market
    severity: medium
    evidence_fields: [issue_size, cornerstone_ratio, offer_price]
    query: 基石投资者 认购 发售股份 39.29% 全球发售
    required_keywords: ["基石投資者", "37,204,500", "39.29%"]
    claim: 基石投资者认购股份约占全球发售股份的39.29%，上市初期的投资者及可流通筹码结构需要关注。
    calculation:
      tool: calculate_percentage
      formula: cornerstone_shares / offer_shares * 100
      inputs:
        cornerstone_shares:
          path: offering.cornerstone_shares
          source_ref: company_info:offering.cornerstone_shares
        offer_shares:
          path: offering.offer_shares
          source_ref: company_info:offering.offer_shares
      unit: percent
      period_path: as_of_date

  - id: data_privacy_compliance
    name: 数据隐私与个人资料合规
    owner: legal
    severity: medium
    evidence_fields: [jurisdiction, regulation, protected_data]
    query: 数据隐私 个人资料 安全法规 人工智能 合规
    required_keywords: ["數據隱私", "個人資料"]
    claim: 公司在多个地区处理健康相关信息和个人资料，适用的数据隐私与安全规则复杂且持续演变，合规成本和违规风险需要关注。

  - id: related_party_transaction
    name: 关联交易
    owner: finance
    enabled: false
    evidence_fields: [counterparty, amount, relationship]

  - id: redemption_or_vam
    name: 赎回或对赌条款
    owner: legal
    enabled: false
    evidence_fields: [clause_text, trigger, obligation]

  - id: litigation_or_penalty
    name: 诉讼与处罚
    owner: legal
    enabled: false
    evidence_fields: [matter, amount, status]

  - id: single_product_dependency
    name: 单一产品依赖
    owner: business
    enabled: false
    evidence_fields: [product, revenue_ratio]
