# 复制为 providers.local.yaml 后填写真实密钥。
# 模型凭证在此配置；数据库连接与可选追踪配置见 .env.example。
embedding:
  # 默认 BM25 模式无需填写；启用 hybrid 时按配置的向量服务填写。
  api_key: ""
  # 可选：当供应商API模型名与本地缓存/pgvector索引名不同时单独填写。
  # model_name: "qwen3-embedding:4b"
  # api_model_name: "Qwen/Qwen3-Embedding-4B"
  # 向量供应商级性能参数，可按本地Ollama或云API能力独立调整。
  batch_size: 64
  request_concurrency: 4
  document_concurrency: 5
  timeout_seconds: 120
  max_retries: 2

llm:
  provider: ark
  base_url: "https://ark.cn-beijing.volces.com/api/plan/v3"
  supports_json_object: false
  api_key: "填写火山方舟ARK-API-Key"
  # 以下价格请按比赛运行时供应商账单填写；不填写时仍统计Token，但不估算人民币。
  input_price_per_million_rmb: null
  output_price_per_million_rmb: null
  cached_input_price_per_million_rmb: null

# 可选：专业Agent复用ARK Agent Plan 的 DeepSeek。
specialist_llm:
  provider: ark
  base_url: "https://ark.cn-beijing.volces.com/api/plan/v3"
  model_name: "deepseek-v4-flash"
  # model_name: "kimi-k3"  # 可选替换模型，默认不启用
  supports_json_object: false
  disable_thinking: true
  api_key: "填写火山方舟ARK-API-Key"
  input_price_per_million_rmb: null
  output_price_per_million_rmb: null
  cached_input_price_per_million_rmb: null

# 公司级并发请在 configs/base.yaml 的 agents.company_concurrency 中设置。
