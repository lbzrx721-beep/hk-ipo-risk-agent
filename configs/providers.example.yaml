# 复制为 providers.local.yaml 后填写真实密钥。
# 程序固定读取项目内这个文件，不读取 Windows 用户环境变量。
embedding:
  api_key: "填写智谱BigModel-API-Key"
  # 向量供应商级性能参数，可按本地Ollama或云API能力独立调整。
  batch_size: 64
  request_concurrency: 4
  document_concurrency: 5
  timeout_seconds: 120
  max_retries: 2

llm:
  provider: ark
  base_url: "https://ark.cn-beijing.volces.com/api/plan/v3"
  supports_json_object: false
  api_key: "填写火山方舟ARK-API-Key"
  # 以下价格请按比赛运行时供应商账单填写；不填写时仍统计Token，但不估算人民币。
  input_price_per_million_rmb: null
  output_price_per_million_rmb: null
  cached_input_price_per_million_rmb: null

# 可选：专业Agent复用ARK API，只把模型名切换为Kimi。
# 未配置时自动复用上面的DeepSeek llm，不影响开发运行。
specialist_llm:
  provider: ark
  base_url: "https://ark.cn-beijing.volces.com/api/plan/v3"
  # model_name: "deepseek-v4-flash"  # 旧专业 Agent 模型，保留但不启用
  model_name: "kimi-k3"
  supports_json_object: false
  disable_thinking: true
  api_key: "填写火山方舟ARK-API-Key"
  input_price_per_million_rmb: null
  output_price_per_million_rmb: null
  cached_input_price_per_million_rmb: null

# 批量分析的公司级 Agent 并发。建议从2开始，再按供应商限流逐步提高。
agents:
  company_concurrency: 2
