[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-ipo-risk-agent"
version = "0.1.0"
description = "Evidence-grounded multi-agent risk analysis for Hong Kong IPO prospectuses"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "PyYAML>=6,<7",
    "orjson>=3.10,<4",
    "structlog>=24,<27",
    "langgraph>=1.0,<2",
    "typer>=0.12,<1",
    "rich>=13,<15",
]

[project.optional-dependencies]
pdf = [
    "pymupdf>=1.26,<2",
    "Pillow>=11,<13",
    "opencc-python-reimplemented>=0.1.7,<1",
]
ocr = [
    "rapidocr>=3,<4",
    "onnxruntime>=1.20,<2",
]
retrieval = [
    "rank-bm25>=0.2.2,<1",
    "jieba>=0.42,<1",
    "numpy>=2,<3",
    "sentence-transformers>=4,<6",
    "chromadb>=1.5.9,<2",
]
data = [
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "pyarrow>=18,<23",
    "duckdb>=1.2,<2",
]
modeling = [
    "scikit-learn>=1.6,<2",
    "lightgbm>=4.5,<5",
    "shap>=0.47,<1",
    "matplotlib>=3.9,<4",
    "joblib>=1.4,<2",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "openai>=1.60,<3",
    "tenacity>=9,<10",
]
ui = [
    "streamlit>=1.42,<2",
    "plotly>=6,<7",
    "pandas>=2.2,<4",
]
reporting = [
    "jinja2>=3.1,<4",
    "reportlab>=4.2,<5",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.5",
    "mypy>=1.15,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ipo_risk.storage" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "tmp/pytest_cache"
addopts = "--basetemp=tmp/pytest_runtime"
markers = [
    "integration: 使用公开真实文件验证端到端链路",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "fitz",
    "fitz.*",
    "jieba",
    "jieba.*",
    "opencc",
    "opencc.*",
    "rank_bm25",
    "rank_bm25.*",
    "rapidocr",
    "rapidocr.*",
    "reportlab",
    "reportlab.*",
    "yaml",
    "yaml.*",
    "chromadb",
    "chromadb.*",
    "joblib",
    "sklearn",
    "sklearn.*",
    "pandas",
    "pandas.*",
]
ignore_missing_imports = true
